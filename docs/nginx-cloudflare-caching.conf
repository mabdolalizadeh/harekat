# ==============================================================================
# Nginx Configuration Template: Cloudflare-Aware Caching & Reverse Proxy
# School Harekat Platform (harekat-backend, harekat-landing, harekat-dashboard, harekat-admin)
# ==============================================================================

# 1. Cloudflare IP Ranges for Real IP Restoration
# Ensures accurate client IP logging and rate limiting behind Cloudflare proxy
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# 2. Upstream Backend Definition
upstream harekat_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name schoolharekat.ir admin.schoolharekat.ir dashboard.schoolharekat.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name schoolharekat.ir admin.schoolharekat.ir dashboard.schoolharekat.ir;

    # SSL Certificates (Cloudflare Origin Certificate recommended)
    # ssl_certificate /etc/ssl/certs/schoolharekat.pem;
    # ssl_certificate_key /etc/ssl/private/schoolharekat.key;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip & Brotli compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 3. Content-Hashed Static Assets (Vite Bundles)
    # Assets in /assets/ have unique hashes (e.g. index-B4d9E1.js).
    # Cache for 1 year with immutable flag both at Cloudflare edge and in browser.
    location ~* ^/assets/ {
        proxy_pass http://harekat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Edge & Browser Caching Headers
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status "HIT-IMMUTABLE" always;
    }

    # 4. Uploaded Media (/uploads/)
    # Uploaded media are converted to WebP with unique timestamp/hash filenames.
    # Cache for 30 days with stale-while-revalidate.
    location ~* ^/uploads/ {
        proxy_pass http://harekat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    # 5. HTML Entry Points & Dynamic API Routes
    # SPA index.html and all API requests MUST revalidate so new frontend deployments
    # and dynamic database changes immediately reflect without manual Cloudflare purges.
    location / {
        proxy_pass http://harekat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for streaming/event responses
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
